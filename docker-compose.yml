services:

  # PostgreSQL with PostGIS
  db:
    image: postgis/postgis:16-3.4
    container_name: quantumroute-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: quantumroute
      POSTGRES_USER: quantumroute
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quantumroute_local_only}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantumroute -d quantumroute"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI optimizer
  optimizer:
    build:
      context: ./optimizer
      dockerfile: Dockerfile
    container_name: quantumroute-optimizer
    restart: unless-stopped
    ports:
      - "8000:8000"

  # Spring Boot backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quantumroute-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/quantumroute
      SPRING_DATASOURCE_USERNAME: quantumroute
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-quantumroute_local_only}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - see .env.example}
      APP_OPTIMIZER_BASE_URL: http://optimizer:8000
      APP_OPTIMIZER_CONNECT_TIMEOUT_MS: ${OPTIMIZER_CONNECT_TIMEOUT_MS:-3000}
      APP_OPTIMIZER_READ_TIMEOUT_MS: ${OPTIMIZER_READ_TIMEOUT_MS:-60000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
      optimizer:
        condition: service_started

  # React frontend with Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quantumroute-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  pgdata:
