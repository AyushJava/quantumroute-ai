spring.application.name=backend
server.port=8081
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=15
app.jwt.clock-skew-seconds=30
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.optimizer.base-url=${OPTIMIZER_BASE_URL:http://localhost:8000}
app.optimizer.connect-timeout-ms=${OPTIMIZER_CONNECT_TIMEOUT_MS:3000}
app.optimizer.read-timeout-ms=${OPTIMIZER_READ_TIMEOUT_MS:60000}
app.executor.core-size=${EXECUTOR_CORE_SIZE:2}
app.executor.max-size=${EXECUTOR_MAX_SIZE:4}
app.executor.queue-capacity=${EXECUTOR_QUEUE_CAPACITY:50}
spring.jackson.deserialization.fail-on-unknown-properties=true
